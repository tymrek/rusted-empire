[package]
name = "rs-empire"
version = "0.9.1-beta"
license = "GPL-2.0-only"
edition = "2021"
rust-version = "1.75"

[dependencies]
ratatui = "=0.26.0"
crossterm = "=0.27.0"
unicode-segmentation = "=1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
# Release binaries leave out debug symbols: 1.3 MB instead of 14.6 MB, and no paths
# from the build machine inside.
strip = true
